<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- 👉 REEMPLAZA "https://TU-NUEVA-URL.com" POR LA URL DE TU NUEVA PLATAFORMA 👈 -->
<meta http-equiv="refresh" content="2; url=https://TU-NUEVA-URL.com">

<title>MED NOTES® · Redirigiendo a la nueva plataforma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #1e40af 0%, #7c3aed 100%);
    color: #fff;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }

  .card {
    max-width: 520px;
    padding: 48px 36px;
  }

  .brand-badge {
    display: inline-flex;
    align-items: center;
    background: #000;
    color: #fff;
    padding: 8px 16px;
    font: 700 14px 'JetBrains Mono', monospace;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border-radius: 6px;
    margin-bottom: 28px;
  }
  .brand-badge .reg { font-size: 9px; vertical-align: top; opacity: 0.85; margin-left: 2px; }

  h1 {
    font-size: 32px;
    font-weight: 800;
    margin-bottom: 12px;
    letter-spacing: -0.02em;
    line-height: 1.15;
  }

  p {
    font-size: 16px;
    opacity: 0.92;
    line-height: 1.6;
    margin-bottom: 24px;
    max-width: 420px;
    margin-left: auto;
    margin-right: auto;
  }

  .spinner {
    width: 36px; height: 36px;
    border: 3px solid rgba(255,255,255,0.25);
    border-top-color: #fff;
    border-radius: 50%;
    margin: 18px auto 28px;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .btn {
    display: inline-block;
    background: #fff;
    color: #1e40af;
    padding: 12px 28px;
    border-radius: 10px;
    text-decoration: none;
    font: 700 14.5px 'Inter', sans-serif;
    transition: transform .15s, box-shadow .15s;
    box-shadow: 0 4px 14px rgba(0,0,0,0.20);
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
  }

  .footer-note {
    margin-top: 26px;
    font-size: 12.5px;
    opacity: 0.75;
  }
</style>
</head>
<body>

<div class="card">
  <div class="brand-badge">MED NOTES<span class="reg">®</span></div>

  <h1>🩺 Plataforma migrada</h1>

  <p>Estamos redirigiéndote a la nueva plataforma de herramientas médicas en unos segundos.</p>

  <div class="spinner"></div>

  <!-- 👇 También cambia el href de este botón con tu URL 👇 -->
  <a class="btn" id="manual-link" href="https://TU-NUEVA-URL.com">
    Ir ahora a la nueva plataforma →
  </a>

  <p class="footer-note">
    Si no eres redirigido automáticamente, haz clic en el botón.
  </p>
</div>

<script>
  /* Redirect por JavaScript también, como respaldo del meta refresh */
  setTimeout(function () {
    var link = document.getElementById('manual-link').getAttribute('href');
    if (link && !link.includes('TU-NUEVA-URL')) {
      window.location.replace(link);
    }
  }, 2200);
</script>

</body>
</html>
